<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whitespace Analysis · eChannel Manager · Ahli Bank Oman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000; --bg:#ececec; --card:#fff; --line:#e3e3e3; --ink:#262626; --ink2:#404040; --mute:#8b8b8b;
  --magenta:#EC2275; --pink:#E8477C; --lime:#CDDE06; --green:#6fbf1f; --red:#e5322d;
  --blue:#3B9FE8; --blue2:#1976C8; --yellow:#FBBF24; --orange:#F97F2B; --indigo:#3B1FA0;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:12px;line-height:1.45;-webkit-text-size-adjust:100%}
button,select{font-family:inherit}
svg{display:block}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.main{flex:1;min-width:0;background:var(--bg);padding:14px 12px 28px}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:thin}
.tab{border:1px solid #111;background:#fff;color:var(--ink);border-radius:8px;padding:6px 11px;font-size:11px;font-weight:500;cursor:pointer;white-space:nowrap}
.tab:hover{background:#f6f6f6}
.tab.active{background:#000;color:#fff}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:12px;border:1px solid var(--line);padding:14px 16px;min-width:0}
.card h3{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--ink)}
.card h3 small{font-weight:400;color:var(--mute);font-size:10.5px;margin-left:6px}
.head{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.head .ttl{font-size:14px;font-weight:600}
.head .sub{font-size:10.5px;color:var(--mute);margin-top:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:10.5px;color:var(--ink2);background:#fafafa;white-space:nowrap}
.chip.m{border-color:var(--magenta);color:var(--magenta);background:#fff8fb}
.ghost{border:1px solid #111;background:#fff;border-radius:8px;font-size:10.5px;padding:4px 10px;cursor:pointer}
.ghost:hover{background:#f3f3f3}

.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:14px;align-items:end;margin-bottom:12px}
.filters label{display:block;font-size:10.5px;color:var(--ink2);margin-bottom:5px}
.filters select{width:100%;height:30px;border:1px solid #cfcfcf;border-radius:6px;background:#fff;font-size:10.5px;padding:0 8px;color:var(--ink);cursor:pointer}
.filters select:focus{outline:2px solid var(--lime);outline-offset:1px}
.btn-reset{height:30px;background:var(--lime);border:0;border-radius:6px;font-size:10.5px;font-weight:500;padding:0 14px;cursor:pointer;color:#111}
.btn-reset:hover{filter:brightness(.95)}
.sect{font-size:11px;font-weight:500;margin:4px 2px 8px}

.grid{display:grid;gap:12px;margin-bottom:12px}
.ov{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-content:start}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi .t{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 10px}
.kpi .l{font-size:13px;font-weight:500;color:#8f8f8f}
.kpi .v{font-size:17px;font-weight:500;color:#333;margin-top:2px}
.kpi .ico{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:0 0 32px}
.kpi .f{border-top:1px solid #e8e8e8;padding:6px 14px;font-size:10px;color:var(--green)}
.kpi .f.r{color:var(--red)}
.ico.pink{background:#fbdde9;color:var(--magenta)} .ico.blue{background:#dcecfa;color:var(--blue2)} .ico.lime{background:#f1f6c2;color:#7a8a00} .ico.org{background:#fde6d6;color:var(--orange)} .ico.ind{background:#e4def6;color:var(--indigo)}

.band{background:#262626;color:#fff;border-radius:12px;padding:12px 18px;display:flex;gap:14px;align-items:center;margin-bottom:12px}
.band .lbl{color:var(--lime);font-size:10px;font-weight:600;letter-spacing:1.2px;white-space:nowrap}
.band .tx{font-size:11.5px;line-height:1.55;color:#e9edf3}
.band b{color:#fff}

/* bars */
.hb{display:grid;grid-template-columns:112px minmax(0,1fr) 78px;gap:8px;align-items:center;margin:8px 0;font-size:11px}
.hb .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.hb .track{position:relative;height:14px;background:#f2f2f2;border-radius:0 8px 8px 0}
.hb .bar{height:100%;border-radius:0 8px 8px 0;transition:width .35s}
.hb .vl{text-align:right;font-weight:500;color:#333}
.hb .tgt{position:absolute;top:-3px;bottom:-3px;width:2px;background:#111}
.click{cursor:pointer}
.click:hover .lb{color:var(--magenta);font-weight:500}
.stk{display:flex;height:16px;border-radius:8px;overflow:hidden;background:#eee}
.stk i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:10px;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.pr{display:grid;grid-template-columns:112px minmax(0,1fr) 60px;gap:8px;align-items:center;margin:9px 0;font-size:11px}
.pr .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.pr .vl{text-align:right;font-weight:500}

/* tables */
.tw{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:11px}
.dt th{font-weight:500;color:var(--mute);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:10.5px}
.dt th.s{cursor:pointer;user-select:none}
.dt th.s:hover{color:var(--magenta)}
.dt td{padding:8px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
.dt tr:last-child td{border-bottom:0}
.dt tr.sel td{background:#fff8fb}
.dt .n{text-align:right;white-space:nowrap}
.dt th.n{text-align:right}
.tag{display:inline-block;border-radius:10px;padding:2px 9px;font-size:9.5px;font-weight:500;white-space:nowrap}
.tag.h{background:#fde3ed;color:var(--magenta)} .tag.m{background:#fff2cc;color:#9a6b00} .tag.l{background:#ececec;color:#666}
.mini{display:inline-flex;align-items:center;gap:6px;width:100%}
.mini i{display:block;height:6px;border-radius:3px;background:var(--pink)}
.pchip{display:inline-block;background:#f1f1f1;border-radius:6px;padding:1px 6px;margin:1px 2px 1px 0;font-size:9.5px;color:#555;white-space:nowrap}
.pchip.g{background:#f3f8c9;color:#5c6800;font-weight:500}
.empty{padding:26px;text-align:center;color:var(--mute)}

/* heatmap */
.heat{border-collapse:separate;border-spacing:3px;width:100%;font-size:10.5px}
.heat th{font-weight:500;color:var(--ink2);font-size:10px;padding:4px 2px;text-align:center;vertical-align:bottom;line-height:1.2}
.heat th.rl,.heat td.rl{text-align:left;position:sticky;left:0;background:#fff;z-index:1;padding-right:8px;white-space:nowrap;font-size:10.5px}
.heat td.c{text-align:center;padding:9px 3px;border-radius:6px;min-width:58px;font-weight:500;cursor:default}
.heat tr.tot td.c{outline:1px solid #262626;outline-offset:-1px}
.heat tr.tot td.rl{font-weight:600}
.heat th.hl{color:var(--magenta);font-weight:700}
.hm-legend{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--mute);margin-top:8px}
.hm-legend i{display:block;width:150px;height:8px;border-radius:4px}
.ctrl{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.ctrl label{font-size:10.5px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.ctrl select{height:28px;border:1px solid #cfcfcf;border-radius:6px;font-size:10.5px;padding:0 8px;background:#fff}
.donutwrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.dl{font-size:10.5px;display:grid;gap:6px}
.dl div{display:flex;align-items:center;gap:6px}
.dl i{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.dl b{margin-left:auto;padding-left:12px;font-weight:500}
.play{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #f0f0f0}
.play:last-child{border-bottom:0}
.play .no{width:22px;height:22px;flex:0 0 22px;border-radius:50%;background:#fde3ed;color:var(--magenta);font-size:10.5px;font-weight:600;display:grid;place-items:center}
.play .pt{font-size:11.5px;font-weight:500}
.play .ps{font-size:10.5px;color:var(--mute)}
.play .pv{margin-left:auto;text-align:right;white-space:nowrap;font-weight:500;font-size:11.5px}
.foot{font-size:9.5px;color:#7f7f7f;font-style:italic;text-align:right;margin-top:6px}

#tip{position:fixed;z-index:100;display:none;background:#262626;color:#fff;padding:6px 10px;border-radius:7px;font-size:10.5px;line-height:1.45;pointer-events:none;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.25)}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .ov,.g21{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
  .filters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:720px){
  .main{padding:10px 8px 24px}
  .kpis{grid-template-columns:minmax(0,1fr)}
  .hb{grid-template-columns:88px minmax(0,1fr) 62px}
  .pr{grid-template-columns:88px minmax(0,1fr) 54px}
  .band{flex-direction:column;align-items:flex-start;gap:6px}
}
@media (max-width:420px){
  .filters{grid-template-columns:minmax(0,1fr)}
  .btn-reset{width:100%}
}
@media print{
  .tabs,.filters,.ghost{display:none!important}
  body,.main{background:#fff!important}
  .card,.kpi{break-inside:avoid}
}
</style>
</head>
<body>

<div class="shell">
  <main class="main">
    <div class="tabs" id="tabs" role="tablist"></div>

    <section class="card filters" aria-label="Filters">
      <div><label for="fReg">Region</label><select id="fReg"></select></div>
      <div><label for="fBr">Branch</label><select id="fBr"></select></div>
      <div><label for="fSeg">Customer Segment</label><select id="fSeg"></select></div>
      <div><label for="fProd">Product</label><select id="fProd"></select></div>
      <div><button class="btn-reset" id="reset">Reset</button></div>
    </section>

    <div id="view"></div>
  </main>
</div>
<div id="tip"></div>

<script>
/* =====================================================================
   Whitespace Analysis dashboard — Ahli Bank Oman (illustrative sample data)
   ===================================================================== */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sum=a=>a.reduce((x,y)=>x+y,0);
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const K=n=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e5?Math.round(n/1e3)+'K':n>=1e3?(n/1e3).toFixed(1)+'K':Math.round(n)+'';
const omr=n=>'OMR '+(n>=1e6?(n/1e6).toFixed(1)+' M':n>=1e3?Math.round(n/1e3)+' K':Math.round(n));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
const tip=t=>t?`data-tip="${esc(t)}"`:'';
const pct=(v,d=0)=>v.toFixed(d)+'%';

/* ---------- icons ---------- */
const IC={
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
 phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
 link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
 history:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/>',
 box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
 calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
 clip:'<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h6"/>',
 alert:'<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/>',
 crown:'<path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
 target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
 route:'<circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"/>',
 pie:'<path d="M12 3v9h9a9 9 0 1 1-9-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>',
 bars:'<path d="M5 21V11M12 21V4M19 21v-7"/>',
 grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
 menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
 filter:'<path d="M4 6h16M7 12h10M10 18h4"/>',
 swap:'<path d="M4 8h13l-3-3M20 16H7l3 3"/>',
 mobile:'<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
 trend:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
 bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',
 dots:'<circle cx="5" cy="5" r="1.4"/><circle cx="12" cy="5" r="1.4"/><circle cx="19" cy="5" r="1.4"/><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/><circle cx="5" cy="19" r="1.4"/><circle cx="12" cy="19" r="1.4"/><circle cx="19" cy="19" r="1.4"/>',
 org:'<circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M12 8v4M12 12H5v4M12 12h7v4"/>',
 help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7M12 17h.01"/>',
 layout:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M10 10v10"/>'
};
const ico=(n,s=16,sw=1.8)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${IC[n]||''}</svg>`;

/* ---------- master data (illustrative) ---------- */
const REGIONS={
 'Muscat':['Ruwi','Al Khuwair','Seeb','Bawshar','Mabela'],
 'Al Batinah':['Sohar','Barka','Saham'],
 'Dhofar':['Salalah','Thumrait'],
 'Ad Dakhiliyah':['Nizwa','Bahla'],
 'Ash Sharqiyah':['Sur','Ibra'],
 'Al Buraimi':['Al Buraimi']
};
const SEGS=[
 {n:'Mass Retail',share:.38},{n:'Mass Affluent',share:.19},{n:'Priority',share:.07},
 {n:'Youth & Students',share:.13},{n:'Expat Salaried',share:.15},{n:'Business Owners',share:.08}
];
const PRODUCTS=[
 {n:'Savings Account',s:'Savings',rev:8,pb:6},
 {n:'Debit Card',s:'Debit Card',rev:5,pb:8},
 {n:'Credit Card',s:'Credit Card',rev:60,pb:24},
 {n:'Personal Loan',s:'Personal Loan',rev:110,pb:26},
 {n:'Home Finance',s:'Home Finance',rev:240,pb:8},
 {n:'Auto Finance',s:'Auto Finance',rev:90,pb:11},
 {n:'Term Deposit',s:'Term Deposit',rev:40,pb:16},
 {n:'Investment Funds',s:'Investments',rev:85,pb:14},
 {n:'Insurance',s:'Insurance',rev:45,pb:15},
 {n:'Remittance & FX',s:'Remit & FX',rev:20,pb:19}
];
const PLAYS=[
 'Auto-open savings pot at salary credit','Instant digital debit card issuance in app','Pre-approved card offer from salary & spend',
 'One-tap pre-approved loan in mobile app','Home-finance eligibility nudge + RM appointment','Dealer-linked auto pre-approval campaign',
 'Idle-balance sweep to term deposit','Goal-based investing journey for Priority','Bundle cover at loan / card sanction','Zero-fee first remittance via app'
];
const PEN=[ /* base penetration % by segment x product */
 [92,88,12,14,3,5,9,2,4,18],[96,93,38,32,9,14,24,8,14,26],[98,95,62,28,22,20,46,26,34,38],
 [90,85,6,4,1,2,4,1,2,8],[95,92,30,24,3,8,16,6,10,62],[94,90,35,22,12,24,30,10,16,30]
];
const PF=[.85,1.15,1.25,.7,1,1.1]; /* propensity multiplier by segment */
const CH=['Mobile App','Internet Banking','WhatsApp Banking','Digital Wallet','e-Statements','Instant Payments'];
const CHS=['Mobile App','Internet Bkg','WhatsApp','Digital Wallet','e-Statements','Instant Pay'];
const CHT=[75,50,55,55,70,65];
const CHACT=[
 'Assisted app onboarding at branch + first-transaction reward','Business-portal drive with RM demo for owners',
 'Opt-in via SMS link and QR on ATM screens','Tokenise cards at activation (Apple / Google / Samsung Pay)',
 'Paperless incentive at next statement cycle','Alias registration prompt on first transfer'
];
const ADOPT=[
 [46,22,28,18,34,30],[68,40,42,44,52,50],[82,62,50,66,70,66],
 [78,12,60,52,40,64],[72,30,58,48,56,60],[58,55,36,34,48,52]
];
const J=[
 {n:'Account Opened',s:'Opened',act:'Baseline — all onboarded customers'},
 {n:'KYC Completed',s:'KYC',act:'e-KYC reminder via SMS / video KYC'},
 {n:'Account Funded',s:'Funded',act:'Salary-transfer nudge, first-deposit incentive'},
 {n:'Card Activated',s:'Card',act:'PIN-set reminder and instant in-app activation'},
 {n:'Digital Registration',s:'Digital Reg.',act:'ATM-screen prompt + branch app-assist'},
 {n:'First Digital Txn',s:'1st Digital Txn',act:'Zero-fee first transfer / bill-pay reward'},
 {n:'Second Product',s:'2nd Product',act:'Next-best-product offer at day 45'},
 {n:'Primary Bank',s:'Primary Bank',act:'Salary-switch campaign with employers'}
];
const JB=[
 [100,97,90,82,54,42,21,14],[100,98,94,89,72,62,42,32],[100,99,96,93,84,76,60,52],
 [100,95,84,74,70,60,14,6],[100,96,92,86,68,58,30,26],[100,97,93,85,62,50,32,22]
];
const NP=PRODUCTS.length,NC=CH.length,NJ=J.length;
const PAL=['#E8477C','#3B9FE8','#FBBF24','#3B1FA0','#F97F2B','#1976C8','#CDDE06'];
const FUN=['#3B9FE8','#E8477C','#FBBF24','#1976C8','#F97F2B','#3B1FA0','#E8477C','#FBBF24'];

/* ---------- cell model: branch x segment ---------- */
const CELLS=[];
for(const [reg,brs] of Object.entries(REGIONS)){
  for(const br of brs){
    const rb=rng(hash(br));
    const base=reg==='Muscat'?28000+rb()*14000:11000+rb()*12000;
    SEGS.forEach((s,si)=>{
      const r=rng(hash(br+'|'+s.n));
      const cust=Math.round(base*s.share*(.9+r()*.2));
      const mus=reg==='Muscat';
      const pen=PEN[si].map(v=>clamp(v*(.88+r()*.24)+(mus?1.5:0),.3,99));
      const prop=PRODUCTS.map(p=>clamp(p.pb*PF[si]*(.8+r()*.4),1,55));
      const adopt=ADOPT[si].map(v=>clamp(v*(.86+r()*.28)+(mus?3:-1),3,97));
      const j=JB[si].map((v,i)=>i===0?100:clamp(v*(.9+r()*.2),1,99));
      for(let i=1;i<NJ;i++) j[i]=Math.min(j[i],j[i-1]-.5);
      CELLS.push({reg,br,seg:si,cust,pen,prop,adopt,j});
    });
  }
}

/* ---------- synthetic priority customers ---------- */
const FN_M=['Salim','Khalid','Ahmed','Said','Hamad','Nasser','Mohammed','Younis','Talal','Badr','Harith','Sultan'];
const FN_F=['Fatma','Aisha','Maryam','Muna','Zainab','Shamsa','Huda','Amal','Buthaina','Rahma','Noor','Sara'];
const LN=['Al Balushi','Al Harthy','Al Busaidi','Al Kindi','Al Rawahi','Al Riyami','Al Hinai','Al Siyabi','Al Lawati','Al Maamari','Al Habsi','Al Shukaili'];
const EXP=['Rahul Nair','Anil Kumar','Imran Khan','Maria Santos','Joseph Thomas','Priya Menon','Farhan Ali','Grace Mathew','Sanjay Rao','Nadia Hussain','Arjun Pillai','Lina Fernandes'];
const CUS=(()=>{
  const r=rng(2026),out=[],cum=[];let a=0;
  CELLS.forEach(c=>{a+=c.cust;cum.push(a)});
  for(let i=0;i<3200;i++){
    const x=r()*a;const c=CELLS[cum.findIndex(v=>v>=x)];
    const held=[];let best=-1,bs=-1,bsc=0;
    PRODUCTS.forEach((p,pi)=>{
      if(r()*100<c.pen[pi]) held.push(pi);
      else{const sc=clamp(c.prop[pi]/100*1.7+r()*.5-.08,0,.97);const w=sc*(1+p.rev/150);if(w>bs){bs=w;best=pi;bsc=sc}}
    });
    if(best<0) continue;
    const name=c.seg===4?EXP[Math.floor(r()*EXP.length)]:((r()<.5?FN_M:FN_F)[Math.floor(r()*12)]+' '+LN[Math.floor(r()*LN.length)]);
    const chn=c.seg===3?'Mobile push':c.seg===2?'RM call':c.seg===5?'RM visit':(r()<.5?'WhatsApp':'SMS + app');
    out.push({id:'CIF-'+(400000+Math.floor(r()*500000)),name,seg:c.seg,br:c.br,reg:c.reg,held,nbp:best,score:bsc,
      pot:Math.round(PRODUCTS[best].rev*(.8+r()*.5)),chn});
  }
  return out;
})();

/* ---------- state ---------- */
const DEF={tab:'overview',reg:'all',br:'all',seg:'all',prod:'all',hmDim:'seg',hmMetric:'pen',sortK:'val',sortD:-1};
let S={...DEF};
const TABS=[['overview','Whitespace Overview'],['product','Product Whitespace'],['channel','Channel Adoption'],['journey','Customer Journey'],['portfolio','Portfolio Heatmap']];

/* ---------- aggregation ---------- */
function sel(ignore=[]){
  return CELLS.filter(c=>
    (ignore.includes('reg')||S.reg==='all'||c.reg===S.reg)&&
    (ignore.includes('br')||S.br==='all'||c.br===S.br)&&
    (ignore.includes('seg')||S.seg==='all'||c.seg===+S.seg));
}
function agg(cells){
  const m={cust:0,hold:Array(NP).fill(0),ws:Array(NP).fill(0),val:Array(NP).fill(0),ad:Array(NC).fill(0),j:Array(NJ).fill(0)};
  cells.forEach(c=>{
    m.cust+=c.cust;
    for(let p=0;p<NP;p++){
      m.hold[p]+=c.cust*c.pen[p]/100;
      const w=c.cust*(1-c.pen[p]/100)*c.prop[p]/100;
      m.ws[p]+=w;m.val[p]+=w*PRODUCTS[p].rev;
    }
    for(let k=0;k<NC;k++) m.ad[k]+=c.cust*c.adopt[k]/100;
    for(let s=0;s<NJ;s++) m.j[s]+=c.cust*c.j[s]/100;
  });
  const d=m.cust||1;
  m.pen=m.hold.map(h=>h/d*100);
  m.wsPct=m.ws.map(w=>w/d*100);
  m.adPct=m.ad.map(v=>v/d*100);
  m.jPct=m.j.map(v=>v/d*100);
  m.totVal=sum(m.val);m.totWs=sum(m.ws);
  m.avgProd=sum(m.pen)/100;m.avgPen=sum(m.pen)/NP;
  return m;
}
const dl=(key,lo,hi)=>lo+rng(hash(key+S.reg+S.br+S.seg))()*(hi-lo);
const prodDim=p=>S.prod!=='all'&&+S.prod!==p;

/* ---------- reusable chart helpers ---------- */
function hbar(items,o={}){
  const mx=o.max||Math.max(...items.map(i=>i.val),1);
  return items.map(i=>`<div class="hb ${i.prod!=null?'click':''}" ${i.prod!=null?`data-prod="${i.prod}"`:''} ${tip(i.tip)}>
    <div class="lb">${i.label}</div>
    <div class="track"><div class="bar" style="width:${Math.max(1.5,i.val/mx*100)}%;background:${i.color};opacity:${i.dim?.3:1}"></div>${i.target!=null?`<span class="tgt" style="left:${Math.min(100,i.target/mx*100)}%"></span>`:''}</div>
    <div class="vl">${i.text}</div></div>`).join('');
}
function funnel(j,cust){
  const n=J.length,H=34,G=12,W=560,cx=W/2;
  const wd=v=>W*.96*(.34+.66*v/100);
  let s=`<svg viewBox="0 0 ${W} ${n*(H+G)-G}" width="100%" role="img" aria-label="Customer journey funnel">`;
  for(let i=0;i<n;i++){
    const y=i*(H+G),w=wd(j[i]),col=FUN[i];
    if(i<n-1){const w2=wd(j[i+1]);
      s+=`<polygon points="${cx-w/2},${y+H} ${cx+w/2},${y+H} ${cx+w2/2},${y+H+G} ${cx-w2/2},${y+H+G}" fill="${col}" opacity=".35"/>`;}
    s+=`<g ${tip(`<b>${J[i].n}</b><br>${j[i].toFixed(1)}% of customers · ${K(cust*j[i]/100)}`)}>
      <rect x="${cx-w/2}" y="${y}" width="${w}" height="${H}" rx="3" fill="${col}"/>
      <text x="${cx}" y="${y+H/2+3.5}" text-anchor="middle" font-size="11" font-weight="600" fill="${col==='#FBBF24'?'#262626':'#fff'}" font-family="Poppins,sans-serif">${J[i].n}: ${j[i].toFixed(1)}%</text></g>`;
  }
  return s+'</svg>';
}
function donut(items){
  const R=52,C=2*Math.PI*R,tot=sum(items.map(i=>i.v))||1;let acc=0;
  let arcs='';
  items.forEach(i=>{const len=i.v/tot*C;
    arcs+=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${i.c}" stroke-width="22" stroke-dasharray="${Math.max(0,len-1.5)} ${C-Math.max(0,len-1.5)}" stroke-dashoffset="${-acc}" ${tip(`<b>${i.l}</b><br>${omr(i.v)} · ${(i.v/tot*100).toFixed(1)}%`)}/>`;acc+=len});
  return `<div class="donutwrap"><svg viewBox="0 0 140 140" width="170" height="170"><g transform="rotate(-90 70 70)">${arcs}</g>
    <text x="70" y="66" text-anchor="middle" font-size="9" fill="#8b8b8b" font-family="Poppins,sans-serif">Whitespace</text>
    <text x="70" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#262626" font-family="Poppins,sans-serif">${omr(tot)}</text></svg>
    <div class="dl">${items.map(i=>`<div><i style="background:${i.c}"></i>${i.l}<b>${(i.v/tot*100).toFixed(0)}%</b></div>`).join('')}</div></div>`;
}
function lineChart(series,labels,mn,mx){
  const W=640,H=230,pl=34,pr=10,pt=12,pb=26,iw=W-pl-pr,ih=H-pt-pb;
  const X=i=>pl+i*iw/(labels.length-1),Y=v=>pt+ih-(v-mn)/(mx-mn)*ih;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Adoption trend">`;
  for(let g=0;g<=4;g++){const v=mn+(mx-mn)*g/4,y=Y(v);
    s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#ececec"/><text x="${pl-6}" y="${y+3}" text-anchor="end" font-size="9" fill="#8b8b8b" font-family="Poppins,sans-serif">${Math.round(v)}%</text>`;}
  labels.forEach((l,i)=>{s+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="9" fill="#8b8b8b" font-family="Poppins,sans-serif">${l}</text>`});
  series.forEach(se=>{
    s+=`<polyline fill="none" stroke="${se.c}" stroke-width="2.2" stroke-linejoin="round" points="${se.d.map((v,i)=>`${X(i)},${Y(v)}`).join(' ')}"/>`;
    se.d.forEach((v,i)=>{s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="${i===se.d.length-1?4:2.6}" fill="${se.c}" stroke="#fff" stroke-width="1" ${tip(`<b>${se.n}</b> · ${labels[i]}<br>${v.toFixed(1)}%`)}/>`});
  });
  return s+'</svg>';
}
function ramp(kind,t){
  t=clamp(t,0,1);
  const st=kind==='lime'?[[247,250,214],[205,222,6],[110,128,0]]:[[255,240,246],[236,34,117],[110,10,70]];
  const a=t<.55?st[0]:st[1],b=t<.55?st[1]:st[2],u=t<.55?t/.55:(t-.55)/.45;
  return a.map((v,i)=>Math.round(v+(b[i]-v)*u));
}
function heat(rows,cols,o){
  const all=rows.flatMap(r=>r.vals),mn=o.min!=null?o.min:Math.min(...all),mx=o.max!=null?o.max:Math.max(...all);
  let h=`<table class="heat"><thead><tr><th class="rl"></th>${cols.map((c,i)=>`<th class="${o.hl===i?'hl':''}">${c}</th>`).join('')}</tr></thead><tbody>`;
  rows.forEach(r=>{
    h+=`<tr class="${r.tot?'tot':''}"><td class="rl">${r.label}</td>`;
    r.vals.forEach((v,i)=>{
      const rgb=ramp(o.ramp,(v-mn)/(mx-mn||1)),lum=.299*rgb[0]+.587*rgb[1]+.114*rgb[2];
      h+=`<td class="c" style="background:rgb(${rgb});color:${lum<150?'#fff':'#262626'};${o.hl!=null&&o.hl!==i?'opacity:.55':''}" ${tip(`<b>${r.label}</b> × ${cols[i]}<br>${o.fmt(v)}`)}>${o.fmt(v)}</td>`;
    });
    h+='</tr>';
  });
  const lo=ramp(o.ramp,0),md=ramp(o.ramp,.55),hi=ramp(o.ramp,1);
  return `<div class="tw">${h}</tbody></table></div>
  <div class="hm-legend"><span>${o.fmt(mn)}</span><i style="background:linear-gradient(90deg,rgb(${lo}),rgb(${md}),rgb(${hi}))"></i><span>${o.fmt(mx)}</span><span style="margin-left:8px">${o.legend||''}</span></div>`;
}
const band=t=>`<div class="band"><span class="lbl">KEY TAKEAWAY</span><div class="tx">${t}</div></div>`;
const kpi=(l,v,ic,col,f,red)=>`<div class="kpi"><div class="t"><div><div class="l">${l}</div><div class="v">${v}</div></div><div class="ico ${col}">${ico(ic,16)}</div></div><div class="f ${red?'r':''}">${f}</div></div>`;
const rank=(arr)=>arr.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
const scopeLabel=()=>{const p=[];if(S.reg!=='all')p.push(S.reg);if(S.br!=='all')p.push(S.br);if(S.seg!=='all')p.push(SEGS[+S.seg].n);return p.length?p.join(' · '):'all regions and segments'};

/* ---------- views ---------- */
function vOverview(){
  const cells=sel(),m=agg(cells);
  const ord=rank(m.val),top=ord.slice(0,3);
  const gaps=m.j.map((_,i)=>i?m.jPct[i-1]-m.jPct[i]:0),leak=gaps.indexOf(Math.max(...gaps));
  const kp=[
    kpi('Whitespace Value',omr(m.totVal),'filter','pink',`Annual revenue potential ▲ ${dl('a',3,9).toFixed(1)}%`),
    kpi('Open Opportunities',K(m.totWs),'target','blue',`High-propensity gaps ▲ ${dl('b',2,7).toFixed(1)}%`),
    kpi('Cross-Sell Ratio',m.avgProd.toFixed(2),'swap','pink',`Products / Customer ▲ ${dl('c',.05,.25).toFixed(2)}`),
    kpi('Digital Adoption',pct(m.adPct[0]),'mobile','blue',`Mobile app active ▲ ${dl('d',.8,3.2).toFixed(1)}pp`),
    kpi('Journey Completion',pct(m.jPct[7]),'route','org',`Reach Primary Bank stage ▲ ${dl('e',.4,2.1).toFixed(1)}pp`),
    kpi('Portfolio Penetration',pct(m.avgPen,1),'pie','ind',`Avg across 10 products ▲ ${dl('f',.3,1.6).toFixed(1)}pp`)
  ].join('');
  const items=ord.map(p=>({label:PRODUCTS[p].n,val:m.val[p],text:omr(m.val[p]),color:PAL[p%PAL.length],prod:p,dim:prodDim(p),
     tip:`<b>${PRODUCTS[p].n}</b><br>${K(m.ws[p])} whitespace customers<br>${omr(m.val[p])} annual potential`}));
  const segs=SEGS.map((s,i)=>({l:s.n,v:agg(sel(['seg']).filter(c=>c.seg===i)).totVal,c:PAL[i]}));
  const byReg=S.reg==='all';
  const groups=byReg?Object.keys(REGIONS).map(r=>({n:r,cells:sel(['reg','br']).filter(c=>c.reg===r)}))
    :REGIONS[S.reg].map(b=>({n:b,cells:sel(['br']).filter(c=>c.br===b)}));
  const gm=groups.map(g=>({n:g.n,m:agg(g.cells)}));
  const mxv=Math.max(...gm.map(g=>g.m.totVal),1);
  const plays=ord.slice(0,5);
  return band(`Existing customers in <b>${scopeLabel()}</b> hold <b>${omr(m.totVal)}</b> of unrealised annual revenue across <b>${K(m.totWs)}</b> high-propensity product gaps. <b>${PRODUCTS[top[0]].n}</b>, <b>${PRODUCTS[top[1]].n}</b> and <b>${PRODUCTS[top[2]].n}</b> account for ${(sum(top.map(p=>m.val[p]))/m.totVal*100).toFixed(0)}% of it. Mobile adoption is ${pct(m.adPct[0])} against a ${CHT[0]}% target, and the biggest journey leak is at <b>${J[leak].n}</b>.`)+`
  <div class="sect">Retail Whitespace Summary</div>
  <div class="grid ov"><div class="kpis">${kp}</div>
    <div class="card"><h3>Customer Journey Funnel <small>% of onboarded customers reaching each stage</small></h3>${funnel(m.jPct,m.cust)}
    <div class="legend">${J.map((s,i)=>`<span><i style="background:${FUN[i]}"></i>${s.s}</span>`).join('')}</div></div></div>
  <div class="grid g2">
    <div class="card"><h3>Product-wise Whitespace (OMR) <small>click a product to focus</small></h3>${hbar(items)}</div>
    <div class="card"><h3>Whitespace Composition by Segment</h3>${donut(segs)}</div>
  </div>
  <div class="grid g21">
    <div class="card"><h3>${byReg?'Regional':'Branch'} Whitespace <small>${K(m.cust)} customers in scope</small></h3><div class="tw"><table class="dt"><thead><tr><th>${byReg?'Region':'Branch'}</th><th class="n">Customers</th><th style="min-width:120px">Whitespace value</th><th class="n">Mobile adoption</th><th class="n">Products / cust.</th></tr></thead><tbody>
    ${gm.map(g=>`<tr class="${!byReg&&S.br===g.n?'sel':''}"><td>${g.n}</td><td class="n">${K(g.m.cust)}</td>
      <td><span class="mini"><i style="width:${g.m.totVal/mxv*70}%"></i><span>${omr(g.m.totVal)}</span></span></td>
      <td class="n">${pct(g.m.adPct[0])}</td><td class="n">${g.m.avgProd.toFixed(2)}</td></tr>`).join('')}</tbody></table></div></div>
    <div class="card"><h3>Top Recommended Plays</h3>${plays.map((p,i)=>`<div class="play"><div class="no">${i+1}</div><div><div class="pt">${PRODUCTS[p].n}</div><div class="ps">${PLAYS[p]}</div></div><div class="pv">${omr(m.val[p])}<div class="ps">${K(m.ws[p])} customers</div></div></div>`).join('')}</div>
  </div>
  <div class="foot">Illustrative sample data for demonstration. Whitespace = customers not holding a product × modelled propensity to need it × average annual revenue per product.</div>`;
}

function vProduct(){
  const cells=sel(),m=agg(cells);
  const ord=rank(m.val);
  const stack=PRODUCTS.map((p,i)=>{const hold=m.pen[i],ws=m.wsPct[i],low=Math.max(0,100-hold-ws);
    return `<div class="pr click" data-prod="${i}" style="opacity:${prodDim(i)?.35:1}" ${tip(`<b>${p.n}</b><br>Holding ${hold.toFixed(1)}%<br>Likely need (whitespace) ${ws.toFixed(1)}%<br>Low propensity ${low.toFixed(1)}%`)}>
      <div class="lb">${p.n}</div><div class="stk"><i style="width:${hold}%;background:#3B1FA0"></i><i style="width:${ws}%;background:${'#CDDE06'}"></i><i style="width:${low}%;background:#e6e6e6"></i></div><div class="vl">${ws.toFixed(1)}%</div></div>`}).join('');
  /* bubble chart: propensity vs revenue */
  const W=520,H=300,pl=44,pr=16,pt=14,pb=38;
  const props=PRODUCTS.map((p,i)=>m.ws[i]/Math.max(1,m.cust-m.hold[i])*100);
  const xmx=Math.max(...props,10)*1.15,ymn=Math.log10(3),ymx=Math.log10(400);
  const bx=v=>pl+v/xmx*(W-pl-pr),by=v=>pt+(H-pt-pb)*(1-(Math.log10(v)-ymn)/(ymx-ymn));
  const wsMax=Math.max(...m.ws,1);
  let bub=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Propensity versus revenue">
   <rect x="${bx(xmx*.5)}" y="${pt}" width="${W-pr-bx(xmx*.5)}" height="${by(60)-pt}" fill="#f6fadf"/>
   <text x="${W-pr-6}" y="${pt+13}" text-anchor="end" font-size="9.5" font-weight="600" fill="#6d7d00" font-family="Poppins,sans-serif">QUICK WINS</text>
   <line x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}" stroke="#bbb"/><line x1="${pl}" y1="${pt}" x2="${pl}" y2="${H-pb}" stroke="#bbb"/>`;
  [5,10,25,50,100,250].forEach(v=>{bub+=`<line x1="${pl}" x2="${W-pr}" y1="${by(v)}" y2="${by(v)}" stroke="#f0f0f0"/><text x="${pl-6}" y="${by(v)+3}" text-anchor="end" font-size="9" fill="#8b8b8b" font-family="Poppins,sans-serif">${v}</text>`});
  bub+=`<text x="${(pl+W-pr)/2}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="#666" font-family="Poppins,sans-serif">Avg propensity among non-holders (%)</text>
   <text transform="translate(11 ${H/2}) rotate(-90)" text-anchor="middle" font-size="9.5" fill="#666" font-family="Poppins,sans-serif">Revenue / customer / yr (OMR, log)</text>`;
  PRODUCTS.forEach((p,i)=>{const r=5+Math.sqrt(m.ws[i]/wsMax)*17,x=bx(props[i]),y=by(p.rev);
    bub+=`<g style="opacity:${prodDim(i)?.3:1}" ${tip(`<b>${p.n}</b><br>Propensity ${props[i].toFixed(1)}% · ${omr(p.rev)} / yr<br>${K(m.ws[i])} whitespace customers`)}><circle cx="${x}" cy="${y}" r="${r}" fill="${PAL[i%PAL.length]}" fill-opacity=".75" stroke="#fff"/>
     <text x="${x}" y="${y+(i%2?-r-3:r+10)}" text-anchor="middle" font-size="9" fill="#404040" font-family="Poppins,sans-serif">${p.s}</text></g>`});
  bub+='</svg>';
  /* table */
  const rk=rank(m.val),pri=i=>{const r=rk.indexOf(i);return r<3?['h','High']:r<7?['m','Medium']:['l','Low']};
  const rows=PRODUCTS.map((p,i)=>({i,n:p.n,hold:m.hold[i],pen:m.pen[i],ws:m.ws[i],prop:props[i],val:m.val[i]}));
  rows.sort((a,b)=>(a[S.sortK]>b[S.sortK]?1:-1)*S.sortD||0);
  if(S.sortK==='n') rows.sort((a,b)=>a.n.localeCompare(b.n)*S.sortD);
  const arrow=k=>S.sortK===k?(S.sortD<0?' ▼':' ▲'):'';
  const th=(k,l,n)=>`<th class="s ${n?'n':''}" data-sort="${k}">${l}${arrow(k)}</th>`;
  const tbl=`<div class="tw"><table class="dt"><thead><tr>${th('n','Product')}${th('hold','Holders',1)}${th('pen','Penetration',1)}${th('ws','Whitespace cust.',1)}${th('prop','Propensity',1)}${th('val','Est. revenue / yr',1)}<th>Priority</th><th>Suggested play</th></tr></thead><tbody>
   ${rows.map(r=>{const [c,l]=pri(r.i);return `<tr class="${+S.prod===r.i?'sel':''}"><td><b>${r.n}</b></td><td class="n">${K(r.hold)}</td><td class="n">${pct(r.pen,1)}</td><td class="n">${K(r.ws)}</td><td class="n">${pct(r.prop,1)}</td><td class="n"><b>${omr(r.val)}</b></td><td><span class="tag ${c}">${l}</span></td><td>${PLAYS[r.i]}</td></tr>`}).join('')}</tbody></table></div>`;
  /* customers */
  const cl=CUS.filter(c=>(S.reg==='all'||c.reg===S.reg)&&(S.br==='all'||c.br===S.br)&&(S.seg==='all'||c.seg===+S.seg)&&(S.prod==='all'||c.nbp===+S.prod))
    .sort((a,b)=>b.score*b.pot-a.score*a.pot).slice(0,10);
  const ctbl=cl.length?`<div class="tw"><table class="dt"><thead><tr><th>Customer</th><th>Segment · Branch</th><th>Holds</th><th>Next best product</th><th class="n">Propensity</th><th class="n">Potential / yr</th><th>Approach</th></tr></thead><tbody>
   ${cl.map(c=>`<tr><td><b>${c.name}</b><div class="ps" style="font-size:9.5px;color:#8b8b8b">${c.id}</div></td><td>${SEGS[c.seg].n}<div style="font-size:9.5px;color:#8b8b8b">${c.br}</div></td>
   <td>${c.held.slice(0,4).map(h=>`<span class="pchip">${PRODUCTS[h].s}</span>`).join('')}${c.held.length>4?`<span class="pchip">+${c.held.length-4}</span>`:''}</td>
   <td><span class="pchip g">${PRODUCTS[c.nbp].n}</span></td><td class="n"><span class="mini" style="justify-content:flex-end"><i style="width:${c.score*50}px"></i>${(c.score*100).toFixed(0)}%</span></td><td class="n"><b>${omr(c.pot)}</b></td><td>${c.chn}</td></tr>`).join('')}</tbody></table></div>`
    :`<div class="empty">No priority customers match this filter combination.</div>`;
  const t=ord[0];
  return band(`<b>${PRODUCTS[t].n}</b> is the largest single gap: <b>${K(m.ws[t])}</b> customers are likely to need it and are worth <b>${omr(m.val[t])}</b> a year. Products in the top-right of the bubble chart (high propensity, high value) are the fastest wins; Home Finance is high-value but needs an RM-led approach.`)+`
  <div class="grid g21">
    <div class="card"><h3>Product Holding vs Whitespace <small>% of customers · click to focus</small></h3>${stack}
      <div class="legend"><span><i style="background:#3B1FA0"></i>Holding</span><span><i style="background:#CDDE06"></i>Likely need (whitespace)</span><span><i style="background:#e6e6e6"></i>Low propensity</span></div></div>
    <div class="card"><h3>Opportunity Map <small>bubble size = whitespace customers</small></h3>${bub}</div>
  </div>
  <div class="card" style="margin-bottom:12px"><h3>Product Whitespace Analysis <small>customers who do not hold the product but are likely to need it</small></h3>${tbl}</div>
  <div class="card"><h3>Priority Customers – Next Best Product <small>top 10 by propensity × value</small></h3>${ctbl}</div>
  <div class="foot">Illustrative sample data. Customer names and IDs are fictitious.</div>`;
}

function vChannel(){
  const cells=sel(),m=agg(cells);
  const items=CH.map((c,i)=>({label:c,val:m.adPct[i],text:pct(m.adPct[i]),color:m.adPct[i]>=CHT[i]?'#6fbf1f':PAL[i%PAL.length],target:CHT[i],
    tip:`<b>${c}</b><br>Adoption ${m.adPct[i].toFixed(1)}% · target ${CHT[i]}%<br>${K(m.cust-m.ad[i])} non-adopters`}));
  const lbl=['Oct','Nov','Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep'];
  const st=[1.1,.35,1.6],cl=[PAL[0],PAL[1],PAL[5]];
  const ser=[0,1,2].map(k=>{const r=rng(hash('tr'+k+S.reg+S.br+S.seg));
    return {n:CH[k],c:cl[k],d:lbl.map((_,i)=>clamp(m.adPct[k]-(11-i)*st[k]+(i<11?(r()-.5)*1.2:0),2,98))}});
  const mn=Math.floor(Math.min(...ser.flatMap(s=>s.d))/10)*10,mx=Math.min(100,Math.ceil(Math.max(...ser.flatMap(s=>s.d))/10)*10+5);
  const segRows=SEGS.map((s,i)=>({label:s.n,vals:agg(sel(['seg']).filter(c=>c.seg===i)).adPct}));
  segRows.push({label:'All in scope',vals:m.adPct,tot:1});
  const coh=CH.map((c,k)=>{
    let best=-1,bv=-1;SEGS.forEach((s,i)=>{const mm=agg(cells.filter(x=>x.seg===i));const v=mm.cust-mm.ad[k];if(v>bv){bv=v;best=i}});
    return {k,non:m.cust-m.ad[k],gap:Math.max(0,CHT[k]-m.adPct[k]),up:Math.max(0,(CHT[k]-m.adPct[k])/100*m.cust),seg:best>=0?SEGS[best].n:'-'};
  }).sort((a,b)=>b.non-a.non);
  const worst=coh.slice().sort((a,b)=>b.gap-a.gap)[0];
  return band(`<b>${K(m.cust-m.ad[0])}</b> customers in scope are not using the mobile app. The widest gap to target is <b>${CH[worst.k]}</b> (${worst.gap.toFixed(0)}pp below the ${CHT[worst.k]}% target), worth activating <b>${K(worst.up)}</b> customers. Segments with low adoption of Internet Banking and Digital Wallet are the clearest engagement whitespace.`)+`
  <div class="grid g2">
    <div class="card"><h3>Digital Channel Adoption vs Target <small>black tick = target</small></h3>${hbar(items,{max:100})}
      <div class="legend"><span><i style="background:#6fbf1f"></i>At / above target</span><span><i style="background:#E8477C"></i>Below target</span></div></div>
    <div class="card"><h3>Adoption Trend <small>last 12 months</small></h3>${lineChart(ser,lbl,mn,mx)}
      <div class="legend">${ser.map(s=>`<span><i style="background:${s.c}"></i>${s.n}</span>`).join('')}</div></div>
  </div>
  <div class="card" style="margin-bottom:12px"><h3>Channel Adoption by Segment <small>% of customers active on channel</small></h3>
    ${heat(segRows,CHS,{ramp:'pink',min:0,max:100,fmt:v=>v.toFixed(0)+'%',legend:'Darker = higher adoption; pale cells are whitespace'})}</div>
  <div class="card"><h3>Non-Adopter Cohorts &amp; Recommended Plays</h3><div class="tw"><table class="dt"><thead><tr><th>Channel</th><th class="n">Non-adopters</th><th class="n">% of base</th><th class="n">Gap to target</th><th class="n">To activate</th><th>Largest cohort</th><th>Recommended play</th></tr></thead><tbody>
  ${coh.map(c=>`<tr><td><b>${CH[c.k]}</b></td><td class="n">${K(c.non)}</td><td class="n">${pct(c.non/m.cust*100)}</td><td class="n">${c.gap>0?`<span class="tag h">${c.gap.toFixed(0)}pp</span>`:'<span class="tag l">On target</span>'}</td><td class="n"><b>${K(c.up)}</b></td><td>${c.seg}</td><td>${CHACT[c.k]}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="foot">Illustrative sample data. Adoption = customers active on the channel in the last 90 days.</div>`;
}

function vJourney(){
  const cells=sel(),m=agg(cells);
  const drops=m.jPct.map((v,i)=>i?{i,pp:m.jPct[i-1]-v,cust:m.cust*(m.jPct[i-1]-v)/100}:null).filter(Boolean);
  const bad=drops.slice().sort((a,b)=>b.pp-a.pp);
  const r=rng(hash('days'+S.reg+S.br+S.seg));
  const base=[0,3,7,5,12,9,28,41];
  const segRows=SEGS.map((s,i)=>({label:s.n,vals:agg(sel(['seg']).filter(c=>c.seg===i)).jPct}));
  segRows.push({label:'All in scope',vals:m.jPct,tot:1});
  return band(`The biggest leak is <b>${J[bad[0].i-1].n} → ${J[bad[0].i].n}</b>: <b>${bad[0].pp.toFixed(0)}pp</b> of customers (${K(bad[0].cust)}) stall there. Only <b>${pct(m.jPct[6])}</b> take a second product and <b>${pct(m.jPct[7])}</b> become primary-bank customers, so the deepest engagement whitespace sits in the second-product and salary-switch stages.`)+`
  <div class="grid g2">
    <div class="card"><h3>Customer Journey Funnel <small>${K(m.cust)} onboarded customers</small></h3>${funnel(m.jPct,m.cust)}</div>
    <div class="card"><h3>Biggest Journey Leaks <small>where customers stop engaging</small></h3>
      ${bad.slice(0,5).map((d,n)=>`<div class="play"><div class="no">${n+1}</div><div><div class="pt">${J[d.i-1].s} → ${J[d.i].s}</div><div class="ps">${J[d.i].act}</div></div><div class="pv">${K(d.cust)}<div class="ps">${d.pp.toFixed(1)}pp drop-off</div></div></div>`).join('')}
      <div class="foot" style="text-align:left">Recovering 25% of the top-5 leaks would re-engage ${K(sum(bad.slice(0,5).map(d=>d.cust))*.25)} customers.</div></div>
  </div>
  <div class="card" style="margin-bottom:12px"><h3>Stage-by-Stage Whitespace</h3><div class="tw"><table class="dt"><thead><tr><th>Stage</th><th class="n">Reached</th><th class="n">Customers</th><th class="n">Not progressed</th><th class="n">Drop-off</th><th class="n">Median days stalled</th><th>Intervention</th></tr></thead><tbody>
  ${J.map((s,i)=>{const dp=i?m.jPct[i-1]-m.jPct[i]:0;return `<tr><td><b>${s.n}</b></td><td class="n">${pct(m.jPct[i],1)}</td><td class="n">${K(m.j[i])}</td><td class="n">${i?K(m.cust*dp/100):'–'}</td><td class="n">${i?`<span class="tag ${dp>=15?'h':dp>=8?'m':'l'}">${dp.toFixed(1)}pp</span>`:'–'}</td><td class="n">${i?Math.round(base[i]*(.85+r()*.3)):'–'}</td><td>${s.act}</td></tr>`}).join('')}</tbody></table></div></div>
  <div class="card"><h3>Journey Progression by Segment <small>% of customers reaching each stage</small></h3>
    ${heat(segRows,J.map(s=>s.s),{ramp:'pink',min:0,max:100,fmt:v=>v.toFixed(0)+'%',legend:'Pale cells = customers not engaging at that stage'})}</div>
  <div class="foot">Illustrative sample data.</div>`;
}

function vPortfolio(){
  const dimSel={seg:'Segment',br:'Branch',reg:'Region'};
  let groups;
  if(S.hmDim==='seg') groups=SEGS.map((s,i)=>({n:s.n,cells:sel(['seg']).filter(c=>c.seg===i)}));
  else if(S.hmDim==='br'){const cs=sel(['br']);groups=[...new Set(cs.map(c=>c.br))].map(b=>({n:b,cells:cs.filter(c=>c.br===b)}))}
  else{const cs=sel(['reg','br']);groups=Object.keys(REGIONS).map(r=>({n:r,cells:cs.filter(c=>c.reg===r)}))}
  groups=groups.filter(g=>g.cells.length).map(g=>({...g,m:agg(g.cells)}));
  const total=agg(sel(['seg','br','reg']).filter(c=>(S.reg==='all'||c.reg===S.reg)&&(S.br==='all'||c.br===S.br)&&(S.seg==='all'||c.seg===+S.seg)));
  const mt=S.hmMetric;
  const get=(m,p)=>mt==='pen'?m.pen[p]:mt==='ws'?m.wsPct[p]:m.val[p]/1000;
  const fmt=mt==='val'?v=>v>=1000?(v/1000).toFixed(1)+'M':v.toFixed(0)+'K':v=>v.toFixed(mt==='ws'?1:0)+'%';
  const rows=groups.map(g=>({label:g.n,vals:PRODUCTS.map((_,p)=>get(g.m,p))}));
  rows.push({label:'All in scope',vals:PRODUCTS.map((_,p)=>get(total,p)),tot:1});
  const hm=heat(rows,PRODUCTS.map(p=>p.s),{ramp:mt==='pen'?'pink':'lime',min:0,fmt,hl:S.prod==='all'?null:+S.prod,
    legend:mt==='pen'?'Darker = deeper penetration (pale = whitespace)':mt==='ws'?'Darker = more likely-need customers without the product':'Darker = larger annual revenue whitespace (OMR)'});
  /* depth distribution: Poisson-binomial */
  let dist=[1];total.pen.forEach(p=>{const q=p/100,n=Array(dist.length+1).fill(0);dist.forEach((v,k)=>{n[k]+=v*(1-q);n[k+1]+=v*q});dist=n});
  const b=[dist[0]+dist[1],dist[2],dist[3],dist[4],dist[5],sum(dist.slice(6))].map(v=>v*100);
  const bl=['0–1 products','2 products','3 products','4 products','5 products','6+ products'];
  const depth=hbar(bl.map((l,i)=>({label:l,val:b[i],text:pct(b[i]),color:i<2?'#E8477C':i<4?'#3B9FE8':'#3B1FA0',tip:`<b>${l}</b><br>${K(total.cust*b[i]/100)} customers`})),{max:Math.max(...b)*1.1});
  /* hottest cells */
  const hot=[];groups.forEach(g=>PRODUCTS.forEach((p,pi)=>hot.push({g:g.n,p:pi,v:g.m.val[pi],w:g.m.ws[pi],pen:g.m.pen[pi]})));
  hot.sort((a,b)=>b.v-a.v);
  const h0=hot[0];
  return band(`Average portfolio penetration is <b>${pct(total.avgPen,1)}</b> with <b>${total.avgProd.toFixed(2)}</b> products per customer. The hottest whitespace cell is <b>${h0.g} × ${PRODUCTS[h0.p].n}</b> (${omr(h0.v)}, penetration only ${pct(h0.pen,0)}). Use the view and metric selectors to switch between penetration, whitespace share and revenue potential.`)+`
  <div class="card" style="margin-bottom:12px"><h3>Portfolio Penetration Heatmap <small>${dimSel[S.hmDim]} × product</small></h3>
    <div class="ctrl"><label>View by <select id="hmDim">${Object.entries(dimSel).map(([k,v])=>`<option value="${k}" ${S.hmDim===k?'selected':''}>${v}</option>`).join('')}</select></label>
    <label>Metric <select id="hmMetric"><option value="pen" ${mt==='pen'?'selected':''}>Penetration %</option><option value="ws" ${mt==='ws'?'selected':''}>Whitespace % of customers</option><option value="val" ${mt==='val'?'selected':''}>Whitespace value (OMR)</option></select></label></div>
    ${hm}</div>
  <div class="grid g2">
    <div class="card"><h3>Cross-Sell Depth <small>customers by number of products held · avg ${total.avgProd.toFixed(2)}</small></h3>${depth}</div>
    <div class="card"><h3>Hottest Whitespace Cells <small>by ${dimSel[S.hmDim].toLowerCase()} × product</small></h3>
      ${hot.slice(0,6).map((h,i)=>`<div class="play"><div class="no">${i+1}</div><div><div class="pt">${h.g} × ${PRODUCTS[h.p].n}</div><div class="ps">Penetration ${pct(h.pen,0)} · ${K(h.w)} whitespace customers</div></div><div class="pv">${omr(h.v)}</div></div>`).join('')}</div>
  </div>
  <div class="foot">Illustrative sample data.</div>`;
}

/* ---------- shell rendering ---------- */
function buildChrome(){
  $('#tabs').innerHTML=TABS.map(t=>`<button class="tab" role="tab" data-tab="${t[0]}">${t[1]}</button>`).join('');
  $('#fReg').innerHTML='<option value="all">All Regions</option>'+Object.keys(REGIONS).map(r=>`<option>${r}</option>`).join('');
  $('#fSeg').innerHTML='<option value="all">All Segments</option>'+SEGS.map((s,i)=>`<option value="${i}">${s.n}</option>`).join('');
  $('#fProd').innerHTML='<option value="all">All Products</option>'+PRODUCTS.map((p,i)=>`<option value="${i}">${p.n}</option>`).join('');
}
function syncFilters(){
  const brs=S.reg==='all'?Object.values(REGIONS).flat():REGIONS[S.reg];
  $('#fBr').innerHTML='<option value="all">All Branches</option>'+brs.map(b=>`<option ${S.br===b?'selected':''}>${b}</option>`).join('');
  $('#fReg').value=S.reg;$('#fBr').value=S.br;$('#fSeg').value=S.seg;$('#fProd').value=S.prod;
}
function render(){
  syncFilters();
  document.querySelectorAll('.tab[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===S.tab));
  $('#view').innerHTML=({overview:vOverview,product:vProduct,channel:vChannel,journey:vJourney,portfolio:vPortfolio})[S.tab]();
}

/* ---------- events ---------- */
$('#fReg').onchange=e=>{S.reg=e.target.value;S.br='all';render()};
$('#fBr').onchange=e=>{S.br=e.target.value;render()};
$('#fSeg').onchange=e=>{S.seg=e.target.value;render()};
$('#fProd').onchange=e=>{S.prod=e.target.value;render()};
$('#reset').onclick=()=>{S={...DEF,tab:S.tab};render()};
document.addEventListener('click',e=>{
  const t=e.target.closest('.tab[data-tab]');
  if(t){S.tab=t.dataset.tab;render();window.scrollTo({top:0});return}
  const p=e.target.closest('[data-prod]');
  if(p){S.prod=S.prod===p.dataset.prod?'all':p.dataset.prod;render();return}
  const so=e.target.closest('[data-sort]');
  if(so){const k=so.dataset.sort;if(S.sortK===k)S.sortD*=-1;else{S.sortK=k;S.sortD=k==='n'?1:-1}render();return}
  if(e.target.id==='print'){window.print();return}
});
document.addEventListener('change',e=>{
  if(e.target.id==='hmDim'){S.hmDim=e.target.value;render()}
  if(e.target.id==='hmMetric'){S.hmMetric=e.target.value;render()}
});
/* tooltip */
const tipEl=$('#tip');
function place(x,y){
  const w=tipEl.offsetWidth,h=tipEl.offsetHeight;
  tipEl.style.left=clamp(x+14,6,innerWidth-w-6)+'px';
  tipEl.style.top=(y+h+22>innerHeight?y-h-12:y+16)+'px';
}
document.addEventListener('mouseover',e=>{
  const t=e.target.closest('[data-tip]');
  if(t){tipEl.innerHTML=t.dataset.tip;tipEl.style.display='block';place(e.clientX,e.clientY)}else tipEl.style.display='none';
});
document.addEventListener('mousemove',e=>{if(tipEl.style.display==='block')place(e.clientX,e.clientY)});
document.addEventListener('touchstart',e=>{
  const t=e.target.closest('[data-tip]');
  if(t){const q=e.touches[0];tipEl.innerHTML=t.dataset.tip;tipEl.style.display='block';place(q.clientX,q.clientY)}else tipEl.style.display='none';
},{passive:true});

buildChrome();render();
</script>
</body>
</html>
